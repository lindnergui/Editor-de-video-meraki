name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (Ubuntu + GES)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências GStreamer, GES e wgpu
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libges-1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            libasound2-dev libwayland-dev libxkbcommon-dev libx11-dev libvulkan-dev

      - name: Instalar Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes core, ui e app
        run: cargo test -p meraki-core -p meraki-ui -p meraki-app

      - name: Testes do motor GStreamer/GES
        env:
          G_DEBUG: fatal-criticals
        run: cargo test -p meraki-engine

  windows:
    name: Windows (MSVC + GStreamer)
    runs-on: windows-latest
    env:
      GST_VERSION: "1.24.13"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar GStreamer MSVC x86_64 (runtime + devel)
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          $rt = Join-Path $env:RUNNER_TEMP "gst-rt.msi"
          $dev = Join-Path $env:RUNNER_TEMP "gst-dev.msi"
          curl.exe -fsSL "$base/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi" -o $rt
          curl.exe -fsSL "$base/gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi" -o $dev
          foreach ($msi in @($rt, $dev)) {
            $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$msi`" /qn /norestart ADDLOCAL=ALL INSTALLDIR=C:\gstreamer"
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              throw "Falha ao instalar $msi (msiexec exit code $($proc.ExitCode))"
            }
          }
          $gstRoot = @(
            [Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine"),
            "C:\gstreamer\1.0\msvc_x86_64",
            "C:\Program Files\gstreamer\1.0\msvc_x86_64"
          ) | Where-Object { $_ -and (Test-Path $_ -PathType Container) } | Select-Object -First 1
          if (-not $gstRoot) {
            throw "GStreamer MSVC x86_64 não encontrado após instalação"
          }
          $gstRoot = $gstRoot.TrimEnd('\')
          $pkgCfgDir = "$gstRoot\lib\pkgconfig"
          $libDir = "$gstRoot\lib"
          $binDir = "$gstRoot\bin"
          $newPkgCfgPath = if ($env:PKG_CONFIG_PATH) { "$pkgCfgDir;$env:PKG_CONFIG_PATH" } else { $pkgCfgDir }
          $newLib = if ($env:LIB) { "$libDir;$env:LIB" } else { $libDir }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$newPkgCfgPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIB=$newLib" | Out-File -FilePath $env:GITHUB_ENV -Append
          if (Test-Path "$binDir\pkg-config.exe" -PathType Leaf) {
            "PKG_CONFIG=$binDir\pkg-config.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Validar GStreamer e GES via pkg-config
        shell: pwsh
        run: |
          $pcPath = Join-Path $env:GSTREAMER_1_0_ROOT_MSVC_X86_64 "lib\pkgconfig\gst-editing-services-1.0.pc"
          if (-not (Test-Path $pcPath -PathType Leaf)) {
            throw "Arquivo .pc do GES não encontrado em: $pcPath"
          }
          $pkgCfgBin = if ($env:PKG_CONFIG -and (Test-Path $env:PKG_CONFIG -PathType Leaf)) {
            $env:PKG_CONFIG
          } else {
            $cmd = Get-Command pkg-config -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "pkg-config não encontrado no PATH" }
            $cmd.Source
          }
          Write-Host "GSTREAMER_1_0_ROOT_MSVC_X86_64=$env:GSTREAMER_1_0_ROOT_MSVC_X86_64"
          Write-Host "PKG_CONFIG=$pkgCfgBin"
          Write-Host "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH"
          Write-Host "LIB=$env:LIB"
          & $pkgCfgBin --modversion gstreamer-1.0 gst-editing-services-1.0
          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config falhou ao resolver gstreamer-1.0 / gst-editing-services-1.0 (exit $LASTEXITCODE)"
          }

      - name: Instalar Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes core, ui e app
        run: cargo test -p meraki-core -p meraki-ui -p meraki-app

      - name: Testes do motor GStreamer/GES
        env:
          G_DEBUG: fatal-criticals
        run: cargo test -p meraki-engine
